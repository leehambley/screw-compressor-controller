# Keep compilation settings here; user/runtime env vars in esp-config.toml.
include = ["esp-config.toml"]

[target.xtensa-esp32s3-none-elf]
# Flash over the Waveshare's USB-C (USB-Serial-JTAG), then show the log.
runner = "espflash flash --monitor --chip esp32s3"

[build]
rustflags = ["-C", "link-arg=-nostartfiles"]
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["core", "alloc"]
