# Keep compilation settings here; user/runtime env vars in esp-config.toml.
include = ["esp-config.toml"]

[target.xtensa-esp32s3-none-elf]
# Flash over the Waveshare's USB-C (USB-Serial-JTAG), then show the log.
runner = "espflash flash --monitor --chip esp32s3"

[build]
rustflags = ["-C", "link-arg=-nostartfiles"]
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["core", "alloc"]

[env]
# Slint pre-renders glyph bitmaps for the font sizes it finds in ui/main.slint,
# but not for sizes set through properties (Btn.font, Readout.big). List them
# here or the renderer stretches the nearest size, which looks blocky.
SLINT_FONT_SIZES = "22,28,34,36,44,72,96"
