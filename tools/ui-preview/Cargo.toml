[package]
name = "ui-preview"
version = "0.1.0"
edition = "2024"
publish = false

# Renders Software/ui/main.slint with the same software renderer, fonts and
# RGB565 framebuffer the board uses, for screenshots in the README. Host tool:
# it lives outside Software/ so the firmware's Xtensa build config doesn't apply.
[dependencies]
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std", "renderer-software"] }
png = "0.17"

[build-dependencies]
slint-build = "1.18"

# Not part of any other workspace.
[workspace]
